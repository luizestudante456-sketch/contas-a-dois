name: Gerar APK - Contas a Dois v4.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'Contas_a_Dois_Android_v4_2_Atualizacao.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          rm -rf projeto_extraido
          mkdir projeto_extraido
          unzip -q Contas_a_Dois_Android_v4_2_Atualizacao.zip -d projeto_extraido

      - name: Localizar projeto Android
        id: localizar
        run: |
          PROJECT_DIR=$(find projeto_extraido -type f -name settings.gradle -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find projeto_extraido -type f -name settings.gradle.kts -printf '%h\n' | head -1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Projeto Android não encontrado."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: |
          cd "${{ steps.localizar.outputs.project_dir }}"
          gradle assembleDebug

      - name: Localizar APK
        id: apk
        run: |
          APK_PATH=$(find projeto_extraido -type f -name "*debug*.apk" | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Contas-a-Dois-APK-v4.2
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
