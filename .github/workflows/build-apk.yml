
name: Gerar APK - Contas a Dois

on:
  workflow_dispatch:
  push:
    paths:
      - 'Contas_a_Dois_Android_Projeto.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 35
  run: |
    yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
    /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip -q Contas_a_Dois_Android_Projeto.zip

      - name: Compilar APK
        working-directory: contas_a_dois_android
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Contas-a-Dois-APK
          path: contas_a_dois_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
