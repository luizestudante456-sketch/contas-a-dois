name: Gerar APK - Contas a Dois v4.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'Contas_a_Dois_Android_Projeto_v4_0.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          rm -rf projeto_extraido
          mkdir projeto_extraido
          unzip -q Contas_a_Dois_Android_Projeto_v4_0.zip -d projeto_extraido

      - name: Localizar projeto Android
        id: localizar
        run: |
         
